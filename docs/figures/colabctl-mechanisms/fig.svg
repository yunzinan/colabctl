<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 504 214" width="504pt" height="214pt"
     font-family="'TeX Gyre Heros', 'Helvetica Neue', Helvetica, Arimo, Arial, sans-serif" font-size="6.5"
     data-spec="colabctl-fig2" data-spec-version="1">
  <defs>
    <marker id="arrow-main" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0 1.2 L9 5 L0 8.8 Z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-ctrl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
      <path d="M0 1.2 L9 5 L0 8.8 Z" fill="#52606d"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0 1.2 L9 5 L0 8.8 Z" fill="#c00000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="504" height="214" fill="#ffffff"/>

  <g id="p:mux-compare" data-kind="panel">
    <rect x="4" y="28" width="246" height="180" rx="3" fill="#f7f9fc" stroke="#7b8794" stroke-width="0.65"/>
    <text x="10" y="38.40" font-size="7.2" font-weight="700" fill="#0d0d0d">(a) Single-Slot SSH Multiplexing (Before vs. After)</text>

    <g id="p:mux-before" data-kind="panel">
      <text x="12" y="53.5" font-size="6.0" font-weight="700" fill="#4a5568">Without colabctl (Baseline)</text>
    <g id="e:e-b-term" data-kind="edge" data-from="c-term@mux-before" data-to="ws-gate" data-edge-kind="data">
      <path d="M54 66 H89.8" fill="none" stroke="#1f2937" stroke-width="1.15" marker-end="url(#arrow-main)"/>
      <text x="72.0" y="63.0" text-anchor="middle" font-size="6.0" fill="#4a5568">slot 1</text>
    </g>
    <g id="e:e-b-vsc" data-kind="edge" data-from="c-vscode@mux-before" data-to="ws-gate" data-edge-kind="feedback">
      <path d="M54 84 H89.8" fill="none" stroke="#c00000" stroke-width="1.15" marker-end="url(#arrow-red)"/>
      <text x="72.0" y="81.0" text-anchor="middle" font-size="6.0" font-weight="700" fill="#c00000">HTTP 429</text>
    </g>
    <g id="e:e-b-tun" data-kind="edge" data-from="c-tunnel@mux-before" data-to="ws-gate" data-edge-kind="feedback">
      <path d="M54 102 H89.8" fill="none" stroke="#c00000" stroke-width="1.15" marker-end="url(#arrow-red)"/>
      <text x="72.0" y="99.0" text-anchor="middle" font-size="6.0" font-weight="700" fill="#c00000">HTTP 429</text>
    </g>
    <g id="e:e-b-ok" data-kind="edge" data-from="ws-gate" data-to="vm-sshd@mux-before" data-edge-kind="data">
      <path d="M157 66 H192.8" fill="none" stroke="#1f2937" stroke-width="1.15" marker-end="url(#arrow-main)"/>
      <text x="175.0" y="63.0" text-anchor="middle" font-size="6.0" font-weight="700" fill="#15803d">1 OK</text>
    </g>
    <g id="n:c-term@mux-before" data-kind="node" data-role="existing" data-panel="mux-before">
      <rect x="12" y="59" width="42" height="14" rx="2.5" fill="#dae8fc" stroke="#4c6e9b" stroke-width="0.65"/>
      <text x="33.00" y="68.20" text-anchor="middle" font-size="6.0" font-weight="700" fill="#0d0d0d">Terminal</text>
    </g>
    <g id="n:c-vscode@mux-before" data-kind="node" data-role="existing" data-panel="mux-before">
      <rect x="12" y="77" width="42" height="14" rx="2.5" fill="#dae8fc" stroke="#4c6e9b" stroke-width="0.65"/>
      <text x="33.00" y="86.20" text-anchor="middle" font-size="6.0" font-weight="700" fill="#0d0d0d">VS Code</text>
    </g>
    <g id="n:c-tunnel@mux-before" data-kind="node" data-role="existing" data-panel="mux-before">
      <rect x="12" y="95" width="42" height="14" rx="2.5" fill="#dae8fc" stroke="#4c6e9b" stroke-width="0.65"/>
      <text x="33.00" y="104.15" text-anchor="middle" font-size="6.0" font-weight="700" fill="#0d0d0d">-L 8188</text>
    </g>
    <g id="n:ws-gate" data-kind="node" data-role="external" data-panel="mux-before">
      <rect x="91" y="59" width="66" height="50" rx="2.5" fill="#eceff1" stroke="#607d8b" stroke-width="0.65"/>
      <text x="124.00" y="75.25" text-anchor="middle" font-size="6.2" font-weight="700" fill="#0d0d0d">Colab SSH-WS</text>
      <text x="124.00" y="97.15" text-anchor="middle" font-size="6.0" fill="#4a5568">1-slot limit</text>
    </g>
    <g id="n:vm-sshd@mux-before" data-kind="node" data-role="existing" data-panel="mux-before">
      <rect x="194" y="59" width="48" height="50" rx="2.5" fill="#dae8fc" stroke="#4c6e9b" stroke-width="0.65"/>
      <text x="218.00" y="75.20" text-anchor="middle" font-size="6.2" font-weight="700" fill="#0d0d0d">VM sshd</text>
      <text x="218.00" y="97.20" text-anchor="middle" font-size="6.0" fill="#4a5568">1 WS slot</text>
    </g>
    <g id="a:b-reject" data-kind="annotation">
      <rect x="161" y="84" width="29" height="18" rx="2" fill="#fee2e2" stroke="#c00000" stroke-width="0.65"/>
      <text x="175.5" y="95.10" text-anchor="middle" font-size="6.0" font-weight="700" fill="#c00000">429 ×2</text>
    </g>
      <text x="127" y="119.5" text-anchor="middle" font-size="6.0" font-weight="700" fill="#c00000">1/3 OK · HTTP 429 on concurrent use</text>
    </g>

    <line x1="12" y1="125" x2="242" y2="125" stroke="#cbd2d9" stroke-width="0.65" stroke-dasharray="3 2"/>

    <g id="p:mux-after" data-kind="panel">
      <text x="12" y="134.5" font-size="6.0" font-weight="700" fill="#0d0d0d">With colabctl (Pre-Warmed ControlMaster)</text>
    <g id="e:e-a-term" data-kind="edge" data-from="c-term@mux-after" data-to="mux-box" data-edge-kind="data">
      <path d="M54 147 H65 V158 H74.8" fill="none" stroke="#1f2937" stroke-width="0.65" marker-end="url(#arrow-main)"/>
    </g>
    <g id="e:e-a-vsc" data-kind="edge" data-from="c-vscode@mux-after" data-to="mux-box" data-edge-kind="data">
      <path d="M54 165 H74.8" fill="none" stroke="#1f2937" stroke-width="0.65" marker-end="url(#arrow-main)"/>
    </g>
    <g id="e:e-a-tun" data-kind="edge" data-from="c-tunnel@mux-after" data-to="mux-box" data-edge-kind="data">
      <path d="M54 183 H65 V172 H74.8" fill="none" stroke="#1f2937" stroke-width="0.65" marker-end="url(#arrow-main)"/>
    </g>
    <g id="e:e-a-ws" data-kind="edge" data-from="mux-box" data-to="vm-sshd@mux-after" data-edge-kind="data">
      <path d="M150 165 H192.8" fill="none" stroke="#1f2937" stroke-width="1.15" marker-end="url(#arrow-main)"/>
      <text x="172.0" y="160.0" text-anchor="middle" font-size="6.0" font-weight="700" fill="#15803d">1 WS slot</text>
      <text x="172.0" y="174.0" text-anchor="middle" font-size="6.0" font-weight="700" fill="#15803d">zero 429</text>
    </g>
    <g id="n:c-term@mux-after" data-kind="node" data-role="existing" data-panel="mux-after">
      <rect x="12" y="140" width="42" height="14" rx="2.5" fill="#dae8fc" stroke="#4c6e9b" stroke-width="0.65"/>
      <text x="33.00" y="149.20" text-anchor="middle" font-size="6.0" font-weight="700" fill="#0d0d0d">Terminal</text>
    </g>
    <g id="n:c-vscode@mux-after" data-kind="node" data-role="existing" data-panel="mux-after">
      <rect x="12" y="158" width="42" height="14" rx="2.5" fill="#dae8fc" stroke="#4c6e9b" stroke-width="0.65"/>
      <text x="33.00" y="167.20" text-anchor="middle" font-size="6.0" font-weight="700" fill="#0d0d0d">VS Code</text>
    </g>
    <g id="n:c-tunnel@mux-after" data-kind="node" data-role="existing" data-panel="mux-after">
      <rect x="12" y="176" width="42" height="14" rx="2.5" fill="#dae8fc" stroke="#4c6e9b" stroke-width="0.65"/>
      <text x="33.00" y="185.15" text-anchor="middle" font-size="6.0" font-weight="700" fill="#0d0d0d">-L 8188</text>
    </g>
    <g id="n:mux-box" data-kind="node" data-role="novel" data-panel="mux-after" data-delta="d-mux-added">
      <rect x="76" y="140" width="74" height="50" rx="2.5" fill="#ed7d31" stroke="#8f3f08" stroke-width="0.65"/>
      <text x="113.00" y="150.05" text-anchor="middle" font-size="6.3" font-weight="700" fill="#0d0d0d">ControlMaster</text>
      <text x="113.00" y="159.00" text-anchor="middle" font-size="6.3" font-weight="700" fill="#0d0d0d">Mux</text>
      <text x="113.00" y="177.65" text-anchor="middle" font-size="6.0" fill="#2b1200">1 Unix socket · ~1s</text>
    </g>
    <g id="n:vm-sshd@mux-after" data-kind="node" data-role="existing" data-panel="mux-after">
      <rect x="194" y="140" width="48" height="50" rx="2.5" fill="#dcfce7" stroke="#15803d" stroke-width="0.65"/>
      <text x="218.00" y="156.20" text-anchor="middle" font-size="6.2" font-weight="700" fill="#0d0d0d">VM sshd</text>
      <text x="218.00" y="178.15" text-anchor="middle" font-size="6.0" fill="#4a5568">all shared</text>
    </g>
      <text x="127" y="201.5" text-anchor="middle" font-size="6.0" font-weight="700" fill="#15803d">All concurrent clients OK · 0 HTTP 429</text>
    </g>
  </g>

  <g id="p:watchdog-fsm" data-kind="panel">
    <rect x="258" y="28" width="242" height="180" rx="3" fill="#f7f9fc" stroke="#7b8794" stroke-width="0.65"/>
    <text x="264" y="38.35" font-size="7.2" font-weight="700" fill="#0d0d0d">(b) Autonomous VM Cost-Guard Watchdog (In-VM)</text>
    <g id="a:fsm-entry" data-kind="annotation">
      <circle cx="266" cy="80" r="2.6" fill="#1f2937"/>
      <path d="M268.6 80 H280.8" fill="none" stroke="#1f2937" stroke-width="1.15" marker-end="url(#arrow-main)"/>
      <text x="272" y="74.5" text-anchor="middle" font-size="6.0" fill="#4a5568">up</text>
    </g>
    <g id="e:t-busy" data-kind="edge" data-from="st-active" data-to="st-active" data-edge-kind="transition">
      <path d="M312 64 V54 H336 V62.8" fill="none" stroke="#1f2937" stroke-width="0.65" marker-end="url(#arrow-main)"/>
      <text x="324.0" y="51.5" text-anchor="middle" font-size="6.0" fill="#4a5568">poll 15s: busy</text>
    </g>
    <g id="e:t-to-idle" data-kind="edge" data-from="st-active" data-to="st-idle" data-edge-kind="transition">
      <path d="M366 73 H406.8" fill="none" stroke="#1f2937" stroke-width="1.15" marker-end="url(#arrow-main)"/>
      <text x="387.0" y="62.0" text-anchor="middle" font-size="6.0" fill="#4a5568">GPU &lt;5%</text>
      <text x="387.0" y="69.0" text-anchor="middle" font-size="6.0" fill="#4a5568">no PTY</text>
    </g>
    <g id="e:t-resume" data-kind="edge" data-from="st-idle" data-to="st-active" data-edge-kind="transition">
      <path d="M408 87 H367.2" fill="none" stroke="#1f2937" stroke-width="0.65" marker-end="url(#arrow-main)"/>
      <text x="387.0" y="95.0" text-anchor="middle" font-size="6.0" fill="#4a5568">GPU / PTY</text>
    </g>
    <g id="e:t-idle-warn" data-kind="edge" data-from="st-idle" data-to="st-warn" data-edge-kind="transition">
      <path d="M460 96 V142.8" fill="none" stroke="#1f2937" stroke-width="1.15" marker-end="url(#arrow-main)"/>
      <text x="464.0" y="117.0" text-anchor="start" font-size="6.0" fill="#4a5568">idle</text>
      <text x="464.0" y="124.0" text-anchor="start" font-size="6.0" fill="#4a5568">≥ 28m</text>
    </g>
    <g id="e:t-hard-warn" data-kind="edge" data-from="st-active" data-to="st-warn" data-edge-kind="transition">
      <path d="M352 96 V112 H436 V142.8" fill="none" stroke="#1f2937" stroke-width="0.65" marker-end="url(#arrow-main)"/>
      <text x="398.0" y="108.5" text-anchor="middle" font-size="6.0" fill="#4a5568">hard limit T-2m</text>
    </g>
    <g id="e:t-extend" data-kind="edge" data-from="st-warn" data-to="st-active" data-edge-kind="transition">
      <path d="M420 144 V126 H318 V97.2" fill="none" stroke="#52606d" stroke-width="0.65" stroke-dasharray="2.6 1.8" marker-end="url(#arrow-ctrl)"/>
      <text x="368.0" y="123.0" text-anchor="middle" font-size="6.0" fill="#4a5568">extend +2h (user)</text>
    </g>
    <g id="e:t-unassign" data-kind="edge" data-from="st-warn" data-to="st-unassigned" data-edge-kind="transition">
      <path d="M408 161 H367.2" fill="none" stroke="#c00000" stroke-width="1.15" marker-end="url(#arrow-red)"/>
      <text x="387.0" y="155.0" text-anchor="middle" font-size="6.0" font-weight="700" fill="#c00000">2m elapsed</text>
      <text x="387.0" y="170.0" text-anchor="middle" font-size="6.0" font-weight="700" fill="#c00000">/unassign</text>
    </g>
    <g id="n:st-active" data-kind="node" data-role="existing" data-panel="watchdog-fsm">
      <rect x="282" y="64" width="84" height="32" rx="5.0" fill="#dcfce7" stroke="#15803d" stroke-width="0.65"/>
      <text x="324.00" y="75.85" text-anchor="middle" font-size="6.5" font-weight="700" fill="#0d0d0d">Active</text>
      <text x="324.00" y="88.65" text-anchor="middle" font-size="6.0" fill="#4a5568">GPU ≥5% / PTY / HB</text>
    </g>
    <g id="n:st-idle" data-kind="node" data-role="novel" data-panel="watchdog-fsm">
      <rect x="408" y="64" width="84" height="32" rx="5.0" fill="#fff2cc" stroke="#a67500" stroke-width="0.65"/>
      <text x="450.00" y="75.85" text-anchor="middle" font-size="6.5" font-weight="700" fill="#0d0d0d">Idle Countdown</text>
      <text x="450.00" y="88.05" text-anchor="middle" font-size="6.0" fill="#4a5568">idle timer (30m)</text>
    </g>
    <g id="n:st-warn" data-kind="node" data-role="novel" data-panel="watchdog-fsm">
      <rect x="408" y="144" width="84" height="34" rx="5.0" fill="#ed7d31" stroke="#8f3f08" stroke-width="0.65"/>
      <text x="450.00" y="155.65" text-anchor="middle" font-size="6.5" font-weight="700" fill="#0d0d0d">Warning (T-2m)</text>
      <text x="450.00" y="170.15" text-anchor="middle" font-size="6.0" fill="#2b1200">PTY broadcast</text>
    </g>
    <g id="n:st-unassigned" data-kind="node" data-role="external" data-panel="watchdog-fsm">
      <rect x="272" y="144" width="94" height="34" rx="5.0" fill="#fee2e2" stroke="#c00000" stroke-width="1.15"/>
      <rect x="274.2" y="146.2" width="89.6" height="29.6" rx="4.2" fill="none" stroke="#c00000" stroke-width="0.65"/>
      <text x="319.00" y="155.65" text-anchor="middle" font-size="6.5" font-weight="700" fill="#0d0d0d">Unassigned</text>
      <text x="319.00" y="169.60" text-anchor="middle" font-size="6.0" fill="#c00000">0 CU/hr (offline-safe)</text>
    </g>
    <g id="a:fsm-note" data-kind="annotation">
      <text x="379" y="191.5" text-anchor="middle" font-size="6.0" fill="#4a5568">POST $TBE_RUNTIME_ADDR/unassign directly from VM</text>
      <text x="379" y="201.0" text-anchor="middle" font-size="6.0" font-weight="700" fill="#0d0d0d">Stops billing even if laptop sleeps or disconnects</text>
    </g>
  </g>

  <g id="legend" data-kind="legend">
    <rect x="4" y="4.0" width="496" height="18.0" rx="3" fill="#ffffff" stroke="#cbd2d9" stroke-width="0.65"/>
    <g id="legend:leg-existing" data-kind="legend-item">
      <rect x="12.0" y="9.5" width="8.5" height="7.0" rx="1.2" fill="#dae8fc" stroke="#4c6e9b" stroke-width="0.65"/>
      <text x="23.5" y="14.50" font-size="6.0" fill="#0d0d0d">Existing / Baseline</text>
    </g>
    <g id="legend:leg-safeguard" data-kind="legend-item">
      <rect x="92.1" y="9.5" width="8.5" height="7.0" rx="1.2" fill="#ed7d31" stroke="#8f3f08" stroke-width="0.65"/>
      <text x="103.6" y="14.50" font-size="6.0" fill="#0d0d0d">colabctl Safeguard</text>
    </g>
    <g id="legend:leg-safe" data-kind="legend-item">
      <rect x="172.8" y="9.5" width="8.5" height="7.0" rx="1.2" fill="#dcfce7" stroke="#15803d" stroke-width="0.65"/>
      <text x="184.3" y="14.50" font-size="6.0" fill="#0d0d0d">Active / Safe</text>
    </g>
    <g id="legend:leg-stop" data-kind="legend-item">
      <rect x="237.8" y="9.5" width="8.5" height="7.0" rx="1.2" fill="#fee2e2" stroke="#c00000" stroke-width="0.65"/>
      <text x="249.3" y="14.50" font-size="6.0" fill="#0d0d0d">Blocked / Stop Billing</text>
    </g>
    <g id="legend:leg-auto" data-kind="legend-item">
      <path d="M325.2 13.0 H335.7" fill="none" stroke="#1f2937" stroke-width="1.15" marker-end="url(#arrow-main)"/>
      <text x="341.2" y="14.50" font-size="6.0" fill="#0d0d0d">Data / Auto Transition</text>
    </g>
    <g id="legend:leg-control" data-kind="legend-item">
      <path d="M418.9 13.0 H429.4" fill="none" stroke="#52606d" stroke-width="0.65" stroke-dasharray="2.6 1.8" marker-end="url(#arrow-ctrl)"/>
      <text x="434.9" y="14.50" font-size="6.0" fill="#0d0d0d">User Control (extend)</text>
    </g>
  </g>
</svg>
